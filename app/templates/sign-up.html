<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #2b2b2b;
            padding: 40px;
            border-radius: 10px;
            width: 300px;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;

            border: none;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;

            border: none;
            border-radius: 5px;

            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .signup-btn {
            background-color: #2196F3;
        }

        .signup-btn:hover {
            background-color: #1976D2;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🐒 Monkey Auth</h1>

    <form action="/home">

        <input type="text" placeholder="Username">

        <input type="password" placeholder="Password">

        <button type="submit">Log In</button>

    </form>

    <button class="signup-btn">
        Sign Up
    </button>

</div>

</body>
</html>
